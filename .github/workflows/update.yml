name: Update NSE highs and lows

on:
  schedule:
    - cron: "30 11 * * 1-5"      # 17:00 IST, Monday to Friday, after the market closes
  workflow_dispatch:
    inputs:
      full:
        description: "Full 10-year rebuild (slow). Leave off for a daily update."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - name: Fetch data
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then python fetch_nse_prices.py; else python fetch_nse_prices.py --update; fi
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add portal_data symbols.txt
          git diff --staged --quiet || (git commit -m "Update data" && git push)
